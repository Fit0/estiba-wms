# Textos de error en español (idioma por defecto). Formato ICU, dominio `errors`.
#
# La clave es el código de error, que no cambia nunca. Los marcadores {nombre} son los
# parámetros que lleva el error. No uses apóstrofos: son caracteres especiales de ICU.
# Cada código y cada clave debe existir también en errors+intl-icu.en.yaml. Un test lo exige.

shared:
    identifier_invalid: '"{value}" no es un identificador válido de {type, select, ProductId {producto} WarehouseId {almacén} ZoneId {zona} LocationId {ubicación} TenantId {cliente} AsnId {aviso de envío} ReceiptId {recepción} other {recurso}}. Debe ser un UUID.'
    unauthenticated: 'Necesitas iniciar sesión para usar este recurso. Envía el token en la cabecera Authorization: Bearer.'
    token_invalid: 'El token no es válido. Inicia sesión de nuevo.'
    token_expired: 'El token ha caducado. Inicia sesión de nuevo.'
    forbidden: 'Tu rol no permite hacer esto.'
    request_malformed: 'No se ha podido leer el cuerpo de la petición. Comprueba que sea un JSON válido, con los campos obligatorios y los tipos esperados.'
    not_found: 'No existe el recurso solicitado.'
    method_not_allowed: 'Ese método no está permitido en este recurso.'
    not_acceptable: 'El formato de respuesta solicitado no está disponible. Esta API responde en JSON.'
    unsupported_media_type: 'El tipo de contenido de la petición no está soportado. Envía JSON con la cabecera Content-Type: application/json.'
    request_invalid: 'La petición no es válida.'
    internal_error: 'Ha ocurrido un error inesperado. Inténtalo de nuevo más tarde.'

catalog:
    dimensions_invalid: '{field, select, lengthMm {El largo} widthMm {El ancho} heightMm {El alto} weightGrams {El peso} other {La medida}} debe ser un número entero positivo, y se ha recibido {value}.'
    expiry_requires_lot_tracking: 'Un producto controlado por fecha de caducidad debe controlarse también por lote.'
    gtin_already_used: 'El GTIN {gtin} ya pertenece a otro producto del cliente.'
    gtin_invalid: '"{value}" no es un GTIN válido. Debe tener 8, 12, 13 o 14 dígitos y un dígito de control GS1 correcto.'
    packaging_level_invalid: 'El nivel de embalaje {type, select, inner_pack {paquete interior} case {caja} pallet {palé} other {{type}}} debe contener un número entero positivo de unidades base, y se ha recibido {baseUnits}.'
    packaging_level_not_larger: 'El nivel de embalaje {type, select, inner_pack {paquete interior} case {caja} pallet {palé} other {{type}}}, con {baseUnits} unidades base, debe ser mayor que el nivel anterior, que tiene {previousBaseUnits}.'
    product_already_blocked: 'El producto {sku} ya está bloqueado.'
    product_discontinued: 'El producto {sku} está descatalogado y no admite cambios.'
    product_name_invalid: 'El nombre de un producto debe tener entre 1 y 150 caracteres y no puede contener caracteres de control.'
    product_not_blocked: 'El producto {sku} no está bloqueado.'
    product_not_found: 'No existe ningún producto con el identificador {id}.'
    shelf_life_invalid: '{field, select, minShelfLifeAtReceiptDays {La vida útil mínima en la recepción} minShelfLifeAtShipmentDays {La vida útil mínima en la expedición} other {La vida útil mínima}} {trackedByExpiry, select, true {debe ser de cero o más días, y se ha recibido {value}.} other {solo se puede indicar en productos controlados por fecha de caducidad.}}'
    sku_already_used: 'El cliente ya tiene un producto con la referencia {sku}.'
    sku_invalid: '"{value}" no es una referencia (SKU) válida. Usa de 1 a 40 letras, dígitos, puntos, guiones, guiones bajos o barras, empezando y terminando por una letra o un dígito.'

identity:
    credentials_invalid: 'El correo o la contraseña no son correctos.'
    email_already_used: 'Ya existe otro usuario con el correo {email}.'
    email_invalid: '"{value}" no es una dirección de correo válida.'
    language_invalid: '"{value}" no es un idioma. Usa es o en.'
    password_invalid: 'La contraseña debe tener entre {minLength} y {maxLength} caracteres.'
    role_invalid: '"{value}" no es un rol. Usa admin, supervisor u operator.'
    roles_required: 'Un usuario necesita al menos un rol.'
    tenant_name_invalid: 'El nombre de un cliente debe tener entre 1 y {maxLength} caracteres y no puede contener caracteres de control.'
    tenant_not_found: 'No existe ningún cliente con el identificador {id}.'
    user_already_disabled: 'El usuario {email} ya está deshabilitado.'
    user_not_disabled: 'El usuario {email} no está deshabilitado.'
    user_not_found: 'No existe ningún usuario con el correo {email}.'

inbound:
    asn_lines_required: 'Un aviso de envío necesita al menos una línea.'
    asn_not_cancellable: 'El aviso de envío {reference} está {status, select, expected {prevista} partially_received {recibida en parte} received {recibida} closed {cerrada} cancelled {cancelada} other {{status}}}. Solo se puede cancelar un aviso que aún no ha recibido nada.'
    asn_not_closable: 'El aviso de envío {reference} está {status, select, expected {prevista} partially_received {recibida en parte} received {recibida} closed {cerrada} cancelled {cancelada} other {{status}}}. Solo se puede cerrar un aviso que ya ha recibido mercancía.'
    asn_not_found: 'No existe ningún aviso de envío con el identificador {id}.'
    asn_not_receivable: 'El aviso de envío {reference} está {status, select, expected {prevista} partially_received {recibida en parte} received {recibida} closed {cerrada} cancelled {cancelada} other {{status}}}, así que no se puede recibir nada contra él.'
    asn_product_repeated: 'El producto {productId} aparece en más de una línea del aviso de envío. Usa una sola línea por producto.'
    asn_receipt_already_open: 'El aviso de envío {reference} ya tiene una recepción abierta. Ciérrala antes de continuar.'
    asn_reference_already_used: 'El cliente ya tiene un aviso de envío con la referencia {reference}.'
    asn_reference_invalid: 'La referencia de un aviso de envío debe tener entre 1 y {maxLength} caracteres y no puede contener caracteres de control.'
    dock_location_invalid: 'La ubicación {locationId} no puede acoger una recepción: {reason, select, unknown {no existe} not_dock {no es un muelle} blocked {está bloqueada} other {no es válida}}.'
    expected_quantity_invalid: 'La línea del producto {productId} debe esperar al menos una unidad, y se ha recibido {units}.'
    expiry_date_not_tracked: 'El producto {productId} no se controla por fecha de caducidad, así que no se puede recibir con una.'
    expiry_date_passed: 'La mercancía caducó el {expiryDate} y no se puede recibir.'
    expiry_date_required: 'El producto {productId} se controla por fecha de caducidad. Indica la fecha de caducidad.'
    gtin_unknown: 'Ningún producto del catálogo tiene el GTIN {gtin}.'
    lot_not_tracked: 'El producto {productId} no se controla por lote, así que no se puede recibir con uno.'
    lot_number_invalid: 'Un número de lote debe tener entre 1 y 40 caracteres y no puede contener caracteres de control.'
    lot_required: 'El producto {productId} se controla por lote. Indica el número de lote.'
    over_receipt_already_approved: 'El exceso de esta recepción ya está aprobado.'
    over_receipt_missing: 'La recepción no tiene más de lo que anunciaba el aviso de envío, así que no hay nada que aprobar.'
    over_receipt_not_approved: 'La recepción tiene {units} unidades más de las que anunciaba el aviso de envío. Un supervisor debe aprobar el exceso antes de cerrarla.'
    product_not_available: 'El producto {productId} está bloqueado o descatalogado y no se puede recibir.'
    product_unknown: 'El catálogo no tiene ningún producto con el identificador {productId}.'
    receipt_already_closed: 'La recepción {id} está cerrada y ya no admite cambios.'
    receipt_asn_mismatch: 'La recepción {receiptId} no es la recepción abierta del aviso de envío {asnId}.'
    receipt_not_found: 'No existe ninguna recepción con el identificador {id}.'
    received_quantity_invalid: 'Una entrada debe tener al menos una unidad, y se ha recibido {units}.'
    supplier_name_invalid: 'El proveedor debe tener entre 1 y {maxLength} caracteres y no puede contener caracteres de control.'

inventory:
    lot_number_invalid: 'Un número de lote debe tener entre 1 y 40 caracteres y no puede contener caracteres de control.'
    movement_quantity_not_positive: 'Un movimiento de tipo {type, select, receipt {recepción} issue {salida} transfer_out {salida por traspaso} transfer_in {entrada por traspaso} adjustment {regularización} other {{type}}} debe cambiar el stock al menos en una unidad.'
    movement_text_invalid: '{field, select, reason {El motivo} reference {La referencia} other {El texto}} de un movimiento debe tener entre 1 y {maxLength} caracteres y no puede contener caracteres de control.'
    quantity_invalid: 'Una cantidad no puede ser negativa, y se ha recibido {units}.'
    stock_negative: 'No se pueden sacar {requested} unidades de una existencia que solo tiene {onHand}. El stock no puede quedar en negativo.'
    transfer_across_tenants: 'Solo se puede traspasar stock entre existencias del mismo cliente.'
    transfer_product_mismatch: 'Solo se puede traspasar stock entre existencias del mismo producto.'
    transfer_same_stock_item: 'Una existencia no se puede traspasar a sí misma.'

warehouse:
    block_reason_invalid: 'El motivo del bloqueo debe tener entre 1 y {maxLength} caracteres y no puede contener caracteres de control.'
    capacity_invalid: '{field, select, maxWeightKg {El peso máximo} maxVolumeLitres {El volumen máximo} maxPalletPositions {El número máximo de posiciones de palé} other {El límite}} debe ser un número entero positivo, y se ha recibido {value}.'
    location_already_blocked: 'La ubicación {code} ya está bloqueada.'
    location_code_already_used: 'El almacén ya tiene una ubicación con el código {code}.'
    location_code_invalid: '"{value}" no es un código de ubicación válido. Debe tener la forma pasillo-módulo-nivel, por ejemplo A-03-02.'
    location_not_blocked: 'La ubicación {code} no está bloqueada.'
    location_not_found: 'No existe ninguna ubicación con el identificador {id}.'
    name_invalid: 'Un nombre debe tener entre 1 y {maxLength} caracteres y no puede contener caracteres de control.'
    pick_sequence_invalid: 'La secuencia de picking no puede ser negativa, y se ha recibido {value}.'
    warehouse_code_already_used: 'El cliente ya tiene un almacén con el código {code}.'
    warehouse_code_invalid: '"{value}" no es un código de almacén válido. Usa de 2 a 12 letras o dígitos, con guiones sencillos entre grupos.'
    warehouse_not_found: 'No existe ningún almacén con el identificador {id}.'
    zone_code_already_used: 'El almacén ya tiene una zona con el código {code}.'
    zone_code_invalid: '"{value}" no es un código de zona válido. Usa de 1 a 10 letras o dígitos.'
    zone_not_found: 'No existe ninguna zona con el identificador {id} en este almacén.'
    zone_unknown: 'El almacén no tiene la zona {zoneId}.'

# Título de cada respuesta de error, según su estado HTTP.
status:
    '400': 'Solicitud incorrecta'
    '401': 'No autorizado'
    '403': 'Prohibido'
    '404': 'No encontrado'
    '405': 'Método no permitido'
    '406': 'No aceptable'
    '409': 'Conflicto'
    '415': 'Tipo de contenido no soportado'
    '422': 'Entidad no procesable'
    '500': 'Error interno'
    other: 'Error'
