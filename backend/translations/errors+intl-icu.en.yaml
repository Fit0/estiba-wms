# Error texts in English. ICU format, domain `errors`.
#
# The key is the error code, which never changes. {name} placeholders are the parameters the
# error carries. Do not use apostrophes: they are special characters in ICU.
# Every code and key must also exist in errors+intl-icu.es.yaml. A test enforces it.

shared:
    identifier_invalid: '"{value}" is not a valid {type, select, ProductId {product} WarehouseId {warehouse} ZoneId {zone} LocationId {location} TenantId {tenant} AsnId {ASN} ReceiptId {receipt} other {resource}} identifier. It must be a UUID.'
    unauthenticated: 'You need to sign in to use this resource. Send the token in the Authorization: Bearer header.'
    token_invalid: 'The token is not valid. Sign in again.'
    token_expired: 'The token has expired. Sign in again.'
    forbidden: 'Your role does not allow this.'
    product_family_invalid: '"{value}" is not a valid product family. Use 1 to 20 letters or digits, with single hyphens between groups.'
    request_malformed: 'The request body could not be read. Check that it is valid JSON, with the required fields and the expected types.'
    not_found: 'The requested resource does not exist.'
    method_not_allowed: 'That method is not allowed on this resource.'
    not_acceptable: 'The requested response format is not available. This API answers in JSON.'
    unsupported_media_type: 'The content type of the request is not supported. Send JSON with the header Content-Type: application/json.'
    concurrent_update: 'Another request changed the same data a moment ago, such as the stock of the same product. Try again.'
    request_invalid: 'The request is not valid.'
    internal_error: 'An unexpected error happened. Try again later.'

catalog:
    dimensions_invalid: '{field, select, lengthMm {The length} widthMm {The width} heightMm {The height} weightGrams {The weight} other {The measure}} must be a positive whole number, got {value}.'
    expiry_requires_lot_tracking: 'A product tracked by expiry date must also be tracked by lot.'
    gtin_already_used: 'GTIN {gtin} already belongs to another product of the tenant.'
    gtin_invalid: '"{value}" is not a valid GTIN. It must have 8, 12, 13 or 14 digits and a correct GS1 check digit.'
    packaging_level_invalid: 'The {type, select, inner_pack {inner pack} case {case} pallet {pallet} other {{type}}} packaging level must hold a positive whole number of base units, got {baseUnits}.'
    packaging_level_not_larger: 'The {type, select, inner_pack {inner pack} case {case} pallet {pallet} other {{type}}} packaging level, with {baseUnits} base units, must be larger than the previous level, which has {previousBaseUnits}.'
    product_already_blocked: 'Product {sku} is already blocked.'
    product_discontinued: 'Product {sku} is discontinued and cannot change.'
    product_name_invalid: 'A product name must have 1 to 150 characters and no control characters.'
    product_not_blocked: 'Product {sku} is not blocked.'
    product_not_found: 'There is no product with id {id}.'
    shelf_life_invalid: '{field, select, minShelfLifeAtReceiptDays {The minimum shelf life at receipt} minShelfLifeAtShipmentDays {The minimum shelf life at shipment} other {The minimum shelf life}} {trackedByExpiry, select, true {must be zero or more days, got {value}.} other {can only be set on products tracked by expiry date.}}'
    sku_already_used: 'The tenant already has a product with SKU {sku}.'
    sku_invalid: '"{value}" is not a valid SKU. Use 1 to 40 letters, digits, dots, dashes, underscores or slashes, starting and ending with a letter or digit.'

identity:
    credentials_invalid: 'The email or the password is not correct.'
    email_already_used: 'Another user already uses the email address {email}.'
    email_invalid: '"{value}" is not a valid email address.'
    language_invalid: '"{value}" is not a language. Use es or en.'
    password_invalid: 'A password must have {minLength} to {maxLength} characters.'
    refresh_token_invalid: 'The session cannot be renewed. Sign in again.'
    role_invalid: '"{value}" is not a role. Use admin, supervisor or operator.'
    roles_required: 'A user needs at least one role.'
    tenant_name_invalid: 'A tenant name must have 1 to {maxLength} characters and no control characters.'
    tenant_not_found: 'There is no tenant with id {id}.'
    user_already_disabled: 'User {email} is already disabled.'
    user_not_disabled: 'User {email} is not disabled.'
    user_not_found: 'There is no user with email {email}.'

inbound:
    asn_lines_required: 'An ASN needs at least one line.'
    asn_not_cancellable: 'ASN {reference} is {status, select, expected {expected} partially_received {partially received} received {received} closed {closed} cancelled {cancelled} other {{status}}}. Only an ASN that has received nothing yet can be cancelled.'
    asn_not_closable: 'ASN {reference} is {status, select, expected {expected} partially_received {partially received} received {received} closed {closed} cancelled {cancelled} other {{status}}}. Only an ASN that has received goods can be closed.'
    asn_not_found: 'There is no ASN with id {id}.'
    asn_not_receivable: 'ASN {reference} is {status, select, expected {expected} partially_received {partially received} received {received} closed {closed} cancelled {cancelled} other {{status}}}, so nothing can be received against it.'
    asn_product_repeated: 'Product {productId} appears on more than one line of the ASN. Use one line per product.'
    asn_receipt_already_open: 'ASN {reference} already has an open receipt. Close it first.'
    asn_reference_already_used: 'The tenant already has an ASN with reference {reference}.'
    asn_reference_invalid: 'The reference of an ASN must have 1 to {maxLength} characters and no control characters.'
    dock_location_invalid: 'Location {locationId} cannot take a receipt: {reason, select, unknown {it does not exist} not_dock {it is not a dock} blocked {it is blocked} other {it is not valid}}.'
    expected_quantity_invalid: 'The line of product {productId} must expect at least one unit, and {units} was given.'
    expiry_date_not_tracked: 'Product {productId} is not tracked by expiry date, so it cannot be received with one.'
    expiry_date_passed: 'The goods expired on {expiryDate} and cannot be received.'
    expiry_date_required: 'Product {productId} is tracked by expiry date. Give the expiry date.'
    gtin_unknown: 'No product in the catalog has the GTIN {gtin}.'
    lot_not_tracked: 'Product {productId} is not tracked by lot, so it cannot be received with one.'
    lot_number_invalid: 'A lot number must have 1 to 40 characters and no control characters.'
    lot_required: 'Product {productId} is tracked by lot. Give the lot number.'
    over_receipt_already_approved: 'The over-receipt of this receipt is already approved.'
    over_receipt_missing: 'The receipt holds no more than the ASN announced, so there is nothing to approve.'
    over_receipt_not_approved: 'The receipt holds {units} units more than the ASN announced. A supervisor must approve them before it closes.'
    override_reason_invalid: 'The reason must have 1 to {maxLength} characters and no control characters.'
    product_not_available: 'Product {productId} is blocked or discontinued and cannot be received.'
    product_unknown: 'The catalog has no product with id {productId}.'
    putaway_destination_invalid: 'The goods cannot go to location {locationId}: {reason, select, unknown {it does not exist} blocked {it is blocked} wrong_type {it is not of a type that stores these goods} storage_class {its zone is of another storage class} no_room {there is no room for these units} same_as_source {it is the dock they are on} other {it is not valid}}.'
    putaway_override_reason_required: 'The suggested location was {suggestedLocationId}. Give a reason to put the goods elsewhere.'
    putaway_split_invalid: 'A task of {taskUnits} units can only be split leaving at least one unit in each part, and {units} were asked for.'
    putaway_task_already_confirmed: 'Putaway task {id} is already confirmed.'
    putaway_task_not_found: 'There is no putaway task with id {id}.'
    receipt_already_closed: 'Receipt {id} is closed and cannot change.'
    receipt_asn_mismatch: 'Receipt {receiptId} is not the open receipt of ASN {asnId}.'
    receipt_not_found: 'There is no receipt with id {id}.'
    received_quantity_invalid: 'A received item must have at least one unit, and {units} was given.'
    supplier_name_invalid: 'The supplier must have 1 to {maxLength} characters and no control characters.'

inventory:
    allocation_exceeds_requested: '{allocated} units were allocated to a reservation of {requested}.'
    lot_number_invalid: 'A lot number must have 1 to 40 characters and no control characters.'
    movement_quantity_not_positive: 'A {type, select, receipt {receipt} issue {issue} transfer_out {transfer out} transfer_in {transfer in} adjustment {adjustment} other {{type}}} movement must change the stock by at least one unit.'
    movement_text_invalid: 'The {field, select, reason {reason} reference {reference} other {text}} of a movement must have 1 to {maxLength} characters and no control characters.'
    not_enough_available_stock: '{requested} units were asked for and only {available} are not reserved.'
    pick_exceeds_reservation: 'Cannot pick {requested} units: the reservation holds only {held} in that stock item.'
    product_not_allocatable: '{reason, select, unknown {Product {productId} does not exist, so no stock of it can be reserved.} unavailable {Product {productId} is blocked or discontinued, so no stock of it can be reserved.} other {No stock of product {productId} can be reserved.}}'
    product_not_found: 'There is no product with id {id}.'
    quantity_invalid: 'A quantity cannot be negative, and {units} was received.'
    release_exceeds_reserved: 'Cannot release {requested} units from a stock item that has only {reserved} reserved.'
    reservation_already_consumed: 'Reservation {id} was already consumed: its units left the warehouse.'
    reservation_not_active: 'Reservation {id} is no longer active, so it cannot take more units.'
    reservation_not_found: 'There is no reservation {id}.'
    reservation_quantity_not_positive: 'A reservation must ask for at least one unit.'
    reservation_reference_invalid: 'The reference of a reservation must have 1 to 80 characters and no control characters.'
    reservation_request_changed: 'Reservation {reference} was made for {requested} units and {asked} are asked now. A reservation does not change what it covers.'
    stock_item_not_found: 'There is no stock item with id {id}.'
    stock_negative: 'Cannot take {requested} units from a stock item that holds only {onHand}. Stock cannot go negative.'
    stock_not_reservable: 'Stock item {stockItemId} is {status, select, quarantine {in quarantine} damaged {damaged} on_hold {on hold} available {available} other {{status}}}, and only available stock can be reserved.'
    transfer_across_tenants: 'Stock can only be transferred between stock items of the same customer.'
    transfer_product_mismatch: 'Stock can only be transferred between stock items of the same product.'
    transfer_same_stock_item: 'A stock item cannot be transferred to itself.'

outbound:
    allocation_exceeds_ordered: 'Line {line} has {allocated} units allocated, and only {ordered} were ordered.'
    backorder_not_applicable: 'Only a partially allocated order has a backorder to accept, and this one is {status, select, registered {registered} allocated {allocated} in_wave {in a wave} cancelled {cancelled} other {{status}}}.'
    carrier_name_invalid: 'A carrier must have 1 to 60 characters and no control characters.'
    customer_name_invalid: 'A customer name must have 1 to 100 characters and no control characters.'
    no_staging_location: 'Warehouse {warehouseId} has no active staging location to take the picked units to.'
    nothing_to_pack: 'Nothing was picked for order {reference}, so there is nothing to pack.'
    order_already_cancelled: 'Order {reference} is already cancelled.'
    order_already_in_released_wave: 'Order {reference} belongs to a wave that is already on the floor, so it cannot be cancelled. Cancel the wave first.'
    order_already_in_wave: 'Order {reference} already belongs to a wave, so it cannot join another or change its allocated units.'
    order_already_picked: 'Order {reference} is already picked, so it cannot be cancelled.'
    order_already_shipped: 'Order {reference} has already been shipped.'
    order_line_not_found: 'The order has no line {line}.'
    order_lines_invalid: '{reason, select, empty {An order needs at least one line.} too_many {An order holds {maxLines} lines at most.} other {The lines of the order are not valid.}}'
    order_not_found: 'There is no order {id}.'
    order_not_in_wave: 'Order {reference} is not in a wave, so nothing can be picked for it.'
    order_not_picked: 'Order {reference} is {status, select, registered {registered} partially_allocated {partially allocated} allocated {allocated} in_wave {in a wave} cancelled {cancelled} other {{status}}}: only a picked order can be packed.'
    order_not_waveable: 'An order that is {status, select, registered {registered} partially_allocated {partially allocated} cancelled {cancelled} other {{status}}} cannot join a wave{status, select, partially_allocated { until the customer accepts the backorder} other {: it must be allocated, or partially allocated with the backorder accepted}}.'
    order_reference_already_used: 'There is already an order with reference {reference}.'
    order_reference_invalid: 'The reference of an order must have 1 to {maxLength} characters and no control characters.'
    ordered_quantity_invalid: 'Line {line} asks for {units} units, and an order line needs at least one.'
    packed_exceeds_picked: '{packed} units of product {productId} would be packed and only {picked} were picked.'
    packing_already_started: 'Packing of order {reference} has already started.'
    packing_incomplete: '{units, plural, one {# picked unit is} other {# picked units are}} still outside a parcel.'
    parcel_empty: 'A parcel needs at least one product.'
    parcel_not_found: 'The shipment has no parcel with SSCC {sscc}.'
    parcel_units_invalid: 'A parcel cannot hold {units} units of product {productId}.'
    parcel_weight_invalid: 'A parcel weighs between 1 and {max, number} grams, not {grams, number}.'
    pick_exceeds_requested: 'Line {position} asks for {toPick} units and {picked} were picked. More than asked cannot be picked.'
    pick_line_already_confirmed: 'Line {position} of the pick list is already confirmed.'
    pick_line_not_found: 'The pick list has no line {position}.'
    pick_list_already_assigned: 'The pick list is assigned to operator {operatorId}.'
    pick_list_already_picked: 'Pick list {id} already has picks confirmed, so it cannot be cancelled.'
    pick_list_already_started: 'Pick list {id} is already started, so it cannot be assigned again.'
    pick_list_count_invalid: 'A wave is released into 1 to {max} pick lists, and {count} were asked for.'
    pick_list_invalid: '{reason, select, empty {A pick list needs at least one line.} no_units {A line of the pick list asks for no units.} other {The pick list is not valid.}}'
    pick_list_not_found: 'There is no pick list {id}.'
    pick_list_not_in_progress: 'Picks are confirmed on a list in progress, and this one is {status, select, generated {not started} completed {completed} cancelled {cancelled} other {{status}}}.'
    pick_scan_mismatch: '{what, select, location {The location scanned} product {The product scanned} lot {The lot scanned} other {What was scanned}} does not match line {position} of the pick list.'
    picked_exceeds_allocated: 'Line {line} has {picked} units picked and only {allocated} allocated.'
    picked_quantity_invalid: '{units} units cannot be picked.'
    product_not_orderable: '{reason, select, unknown {Product {productId} does not exist, so it cannot be ordered.} unavailable {Product {productId} is blocked or discontinued, so it cannot be ordered.} other {Product {productId} cannot be ordered.}}'
    product_not_picked: 'Product {productId} was not picked for this order.'
    shipment_already_dispatched: 'Shipment {id} has already been dispatched.'
    shipment_already_packed: 'Shipment {id} is already packed.'
    shipment_not_found: 'There is no shipment {id}.'
    shipment_not_packed: 'Shipment {id} is not packed, so it cannot be dispatched.'
    shipping_address_invalid: 'The {field, select, street {street} postalCode {postal code} city {city} countryCode {country} other {address}} of the shipping address is not valid. {field, select, countryCode {It must be a two-letter country code, such as ES.} other {It needs 1 to {maxLength} characters and no control characters.}}'
    short_pick_reason_invalid: 'A short pick reason must have 1 to 200 characters and no control characters.'
    short_pick_reason_required: 'Line {position} asks for {toPick} units and {picked} were picked: give the reason for the short pick.'
    sscc_invalid: '{value} is not a valid SSCC: it has 18 digits and the last one is the GS1 check digit.'
    sscc_serials_exhausted: 'The SSCC serials of company prefix {prefix} have run out.'
    tracking_number_invalid: 'A tracking number must have 1 to 60 characters and no control characters.'
    warehouse_unknown: 'Warehouse {id} does not exist, so an order cannot be served from it.'
    wave_already_cancelled: 'Wave {id} is already cancelled.'
    wave_already_completed: 'Wave {id} is already completed.'
    wave_already_released: 'Wave {id} is already on the floor.'
    wave_not_found: 'There is no wave {id}.'
    wave_orders_invalid: '{reason, select, empty {A wave needs at least one order.} too_many {A wave holds {maxOrders} orders at most.} repeated {The same order is in the wave twice.} other {The orders of the wave are not valid.}}'
    wave_warehouse_mismatch: 'All the orders of a wave must be served from the same warehouse.'

warehouse:
    block_reason_invalid: 'A block reason must have 1 to {maxLength} characters and no control characters.'
    capacity_invalid: '{field, select, maxWeightKg {The maximum weight} maxVolumeLitres {The maximum volume} maxPalletPositions {The maximum number of pallet positions} other {The limit}} must be a positive whole number, got {value}.'
    location_already_blocked: 'Location {code} is already blocked.'
    location_code_already_used: 'The warehouse already has a location with code {code}.'
    location_code_invalid: '"{value}" is not a valid location code. It must be written aisle-module-level, for example A-03-02.'
    location_not_blocked: 'Location {code} is not blocked.'
    location_not_found: 'There is no location with id {id}.'
    name_invalid: 'A name must have 1 to {maxLength} characters and no control characters.'
    pick_sequence_invalid: 'A pick sequence cannot be negative, got {value}.'
    warehouse_code_already_used: 'The tenant already has a warehouse with code {code}.'
    warehouse_code_invalid: '"{value}" is not a valid warehouse code. Use 2 to 12 letters or digits, with single hyphens between groups.'
    warehouse_not_found: 'There is no warehouse with id {id}.'
    zone_code_already_used: 'The warehouse already has a zone with code {code}.'
    zone_code_invalid: '"{value}" is not a valid zone code. Use 1 to 10 letters or digits.'
    zone_not_found: 'There is no zone with id {id} in this warehouse.'
    zone_unknown: 'The warehouse has no zone {zoneId}.'

# Title of each error response, by HTTP status.
status:
    '400': 'Bad request'
    '401': 'Unauthorized'
    '403': 'Forbidden'
    '404': 'Not found'
    '405': 'Method not allowed'
    '406': 'Not acceptable'
    '409': 'Conflict'
    '415': 'Unsupported media type'
    '422': 'Unprocessable entity'
    '500': 'Internal error'
    other: 'Error'
