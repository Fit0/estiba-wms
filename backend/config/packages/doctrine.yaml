doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # Value objects are stored through custom types, so the domain stays free of Doctrine.
        types:
            tenant_id: App\Shared\Infrastructure\Persistence\Doctrine\Type\TenantIdType
            warehouse_id: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\WarehouseIdType
            zone_id: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\ZoneIdType
            location_id: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\LocationIdType
            warehouse_code: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\WarehouseCodeType
            location_code: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\LocationCodeType
            display_name: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\DisplayNameType
            block_reason: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\BlockReasonType
            pick_sequence: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\PickSequenceType
            warehouse_zones: App\Warehouse\Infrastructure\Persistence\Doctrine\Type\ZonesType
            product_id: App\Catalog\Infrastructure\Persistence\Doctrine\Type\ProductIdType
            sku: App\Catalog\Infrastructure\Persistence\Doctrine\Type\SkuType
            product_name: App\Catalog\Infrastructure\Persistence\Doctrine\Type\ProductNameType
            product_gtins: App\Catalog\Infrastructure\Persistence\Doctrine\Type\GtinsType
            product_packaging_levels: App\Catalog\Infrastructure\Persistence\Doctrine\Type\PackagingLevelsType
            user_id: App\Identity\Infrastructure\Persistence\Doctrine\Type\UserIdType
            email: App\Identity\Infrastructure\Persistence\Doctrine\Type\EmailType
            tenant_name: App\Identity\Infrastructure\Persistence\Doctrine\Type\TenantNameType
            password_hash: App\Identity\Infrastructure\Persistence\Doctrine\Type\PasswordHashType
            user_roles: App\Identity\Infrastructure\Persistence\Doctrine\Type\UserRolesType
            asn_id: App\Inbound\Infrastructure\Persistence\Doctrine\Type\AsnIdType
            receipt_id: App\Inbound\Infrastructure\Persistence\Doctrine\Type\ReceiptIdType
            inbound_location_id: App\Inbound\Infrastructure\Persistence\Doctrine\Type\DockLocationIdType
            asn_reference: App\Inbound\Infrastructure\Persistence\Doctrine\Type\AsnReferenceType
            supplier_name: App\Inbound\Infrastructure\Persistence\Doctrine\Type\SupplierNameType
            inbound_asn_lines: App\Inbound\Infrastructure\Persistence\Doctrine\Type\AsnLinesType
            inbound_expected_items: App\Inbound\Infrastructure\Persistence\Doctrine\Type\ExpectedItemsType
            inbound_received_lines: App\Inbound\Infrastructure\Persistence\Doctrine\Type\ReceivedLinesType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Adds the tenant to every query. It starts off and is turned on for each signed-in request.
        filters:
            tenant:
                class: App\Shared\Infrastructure\Persistence\Doctrine\TenantFilter
                enabled: false
        # Each bounded context registers its own XML mapping here,
        # so the domain model stays free of Doctrine attributes.
        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Identity\Domain'
                alias: Identity
            Warehouse:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Warehouse/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Warehouse\Domain'
                alias: Warehouse
            Catalog:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Catalog\Domain'
                alias: Catalog
            Inbound:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inbound/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Inbound\Domain'
                alias: Inbound
            CatalogGtinIndex:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/GtinIndex'
                prefix: 'App\Catalog\Infrastructure\Persistence\GtinIndex'
                alias: CatalogGtinIndex

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
