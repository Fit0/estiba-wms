# The production image of the API, next to the development stack, to measure it (E10-06, ADR 0055).
#
# The development container reads its code through a bind mount, checks every file on every request and
# boots the Symfony kernel in debug mode, so its latency says little about production. This one is the
# image `make images` builds: APP_ENV=prod, a compiled container and opcache that never revalidates.
# It shares the database and Redis of the development stack, so `make perf-seed` data is what it reads.
#
#   make perf-prod-up        # builds it and starts it on http://localhost:8082
#   make perf-load PASSWORD=... URL=http://host.docker.internal:8082
#   make perf-prod-down
#
# APP_SECRET and JWT_PASSPHRASE come from backend/.env, which is not committed.
services:
  api-prod:
    build:
      context: ./backend
      target: frankenphp_prod
    profiles: [perf]
    env_file:
      - backend/.env
    environment:
      APP_ENV: prod
      DEFAULT_URI: http://localhost
      DATABASE_URL: "postgresql://${POSTGRES_USER:-estiba}:${POSTGRES_PASSWORD:-estiba}@database:5432/${POSTGRES_DB:-estiba}?serverVersion=17&charset=utf8"
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MESSENGER_FAILED_TRANSPORT_DSN: "doctrine://default?queue_name=failed&auto_setup=0"
      JWT_SECRET_KEY: /jwt/private.pem
      JWT_PUBLIC_KEY: /jwt/public.pem
      MERCURE_URL: http://localhost/.well-known/mercure
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_PUBLISHER_JWT_KEY:-dev-publisher-key-change-me-0123456789abcdef}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_SUBSCRIBER_JWT_KEY:-dev-subscriber-key-change-me-0123456789abcdef}"
    volumes:
      - ./backend/config/jwt:/jwt:ro
    ports:
      - "${PERF_HTTP_PORT:-8082}:8080"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
